# DO NOT RE-ADD [[routes]] FOR dispatchos.co / www.dispatchos.co.
# The apex now serves the real app (Fly.io: landing for anonymous, SPA for
# authed). Declaring those routes here would make the next `wrangler deploy`
# re-attach this coming-soon Worker to the apex and take the live product
# offline. This Worker is retired from the apex; keep it route-less (deploys
# stay inert) unless it is ever repointed at a NEW, non-apex hostname.

name = "dispatchos-coming-soon"
main = "dist/worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Explicitly disable the workers.dev subdomain too — no hostname should serve
# this Worker anymore.
workers_dev = false

# Former apex bindings, removed on purpose (see header):
# [[routes]]
# pattern = "dispatchos.co"
# custom_domain = true
#
# [[routes]]
# pattern = "www.dispatchos.co"
# custom_domain = true

# KV binding — namespace already exists, ID matches
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "35604aaaed394333b7ba4c65a9ce3c48"

# Custom domains — these are managed separately via API
# (Workers Builds will auto-redeploy on push, but won't change domain bindings)

# Note: ADMIN_TOKEN secret must be set manually via:
#   wrangler secret put ADMIN_TOKEN
# or via dashboard: Worker → Settings → Variables and Secrets
# It's NOT in this file (secrets never go into git).
