name = "dispatchos-coming-soon"
main = "dist/worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Explicitly disable the workers.dev subdomain. Routing is via custom domains
# below — dashboard already provisioned the certs/DNS, this just tells
# wrangler to associate the deployed Worker with these hostnames.
workers_dev = false

[[routes]]
pattern = "dispatchos.co"
custom_domain = true

[[routes]]
pattern = "www.dispatchos.co"
custom_domain = true

# KV binding — namespace already exists, ID matches
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "35604aaaed394333b7ba4c65a9ce3c48"

# Custom domains — these are managed separately via API
# (Workers Builds will auto-redeploy on push, but won't change domain bindings)

# Note: ADMIN_TOKEN secret must be set manually via:
#   wrangler secret put ADMIN_TOKEN
# or via dashboard: Worker → Settings → Variables and Secrets
# It's NOT in this file (secrets never go into git).
