name: Health Monitor

# Pings demo.dispatchos.co + dispatchos.co every 10 minutes from GitHub's
# infra. On failure, sends a Telegram alert to the team chat. Lives next
# to the code, free, version-controlled. Replaces UptimeRobot.
#
# Required GitHub secrets (already set):
#   TELEGRAM_ALERT_BOT_TOKEN   — @DispatchOS_Bot token
#   TELEGRAM_ALERT_CHAT_ID     — -1003992711551 (DispatchOSDev)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping all endpoints
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          set +e
          FAILURES_FILE=/tmp/failures.txt
          : > "$FAILURES_FILE"

          check_url() {
            local name="$1" url="$2" expected="$3" needle="$4" method="${5:-GET}"
            local code body
            if [ "$method" = "OPTIONS" ]; then
              code=$(curl -s -o /tmp/body -w "%{http_code}" -X OPTIONS "$url" -H "Origin: https://dispatchos.co" -H "Access-Control-Request-Method: POST" --max-time 15)
            else
              code=$(curl -s -o /tmp/body -w "%{http_code}" "$url?cb=$(date +%s)" --max-time 15)
            fi
            body=$(head -c 500 /tmp/body 2>/dev/null)
            if [ "$code" != "$expected" ]; then
              printf -- '- <b>%s</b> HTTP %s (expected %s) — %s\n' "$name" "$code" "$expected" "$url" >> "$FAILURES_FILE"
              echo "FAIL $name: HTTP $code"
              return
            fi
            if [ -n "$needle" ] && ! echo "$body" | grep -q "$needle"; then
              printf -- '- <b>%s</b> HTTP %s but body missing %q — %s\n' "$name" "$code" "$needle" "$url" >> "$FAILURES_FILE"
              echo "FAIL $name: body mismatch"
              return
            fi
            echo "OK $name (HTTP $code)"
          }

          check_url "demo-health"          "https://demo.dispatchos.co/api/health"           "200" "ok"         "GET"
          check_url "demo-subscribe-cors"  "https://demo.dispatchos.co/api/public/subscribe" "204" ""           "OPTIONS"
          check_url "landing"              "https://dispatchos.co/"                          "200" "DispatchOS" "GET"

          if [ ! -s "$FAILURES_FILE" ]; then
            echo "all OK"
            exit 0
          fi

          FAILURES=$(cat "$FAILURES_FILE")
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TIME_UTC=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          MSG=$(printf '🚨 <b>DispatchOS health check failed</b>\n\n%s\n\n<i>Run:</i> %s\n<i>Time:</i> %s' "$FAILURES" "$RUN_URL" "$TIME_UTC")

          curl -s -o /tmp/tg_resp -w 'TG=%{http_code}\n' -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "$(jq -nc --arg c "$CHAT_ID" --arg t "$MSG" '{chat_id:$c,text:$t,parse_mode:"HTML",disable_web_page_preview:true}')"
          cat /tmp/tg_resp || true
          exit 1
