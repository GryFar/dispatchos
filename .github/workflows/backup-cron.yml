name: Daily DB Backup

# Audit H5 — offsite, restore-grade DB backup. Pulls a CONSISTENT online
# snapshot of the live SQLite file from /api/cron/backup, ENCRYPTS it
# (AES-256-CBC, PBKDF2) with the BACKUP_ENC_PASSPHRASE secret, and stores the
# ciphertext as a GitHub Actions artifact. This is the zero-config OFFSITE copy:
# free, needs no S3/R2 credentials. (A future S3/R2 target is an owner option.)
#
# The snapshot holds plaintext TOTP secrets, tracking tokens, password hashes
# and all customer PII, so it must NEVER be stored unencrypted where repo-read
# access could download it — the encryption step below hard-fails if the
# passphrase secret is unset rather than falling back to plaintext.
# Restore (needs the same passphrase): docs/runbooks/RESTORE.md.
#
# Runs daily (07:00 UTC) and on manual dispatch — with real customers a weekly
# cadence risked losing up to 7 days of bookings/invoices. The DB is tiny
# (~1MB), so streaming it back over HTTP is safe and non-blocking. Restore
# procedure: docs/runbooks/RESTORE.md.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo. Nothing here uses
# GITHUB_TOKEN to write (no pushes, issues, PR comments, packages or releases).
permissions:
  contents: read

concurrency:
  group: backup-cron
  cancel-in-progress: false

# Target host is configurable so the backup follows the real deployment. Set
# repo variable DISPATCHOS_BASE_URL to the live app URL; falls back to demo.
env:
  BASE_URL: ${{ vars.DISPATCHOS_BASE_URL || 'https://demo.dispatchos.co' }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull DB snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          OUT="dispatchos-backup-$(date +%Y%m%d).db"
          echo "BACKUP_FILE=$OUT" >> "$GITHUB_ENV"
          CODE=$(curl -fsS -o "$OUT" -w '%{http_code}' "$BASE_URL/api/cron/backup" \
            -H "X-Cron-Secret: $CRON_SECRET" --max-time 120 || echo 000)
          if [ "$CODE" != "200" ]; then
            echo "::error::backup endpoint returned HTTP $CODE"
            exit 1
          fi
          echo "Saved $OUT ($(wc -c < "$OUT") bytes)."

      - name: Encrypt snapshot (never store plaintext PII offsite)
        env:
          BACKUP_ENC_PASSPHRASE: ${{ secrets.BACKUP_ENC_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_ENC_PASSPHRASE" ]; then
            echo "::error::BACKUP_ENC_PASSPHRASE secret is not set — refusing to upload an UNENCRYPTED DB snapshot (it holds plaintext TOTP secrets, password hashes and all PII). Set it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          ENC="${BACKUP_FILE}.enc"
          # AES-256-CBC + PBKDF2 (200k iterations). RESTORE.md decrypts with the
          # SAME cipher/iter, so keep these in sync if ever changed.
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$BACKUP_FILE" -out "$ENC" -pass env:BACKUP_ENC_PASSPHRASE
          # Remove the plaintext so it can never be uploaded by accident.
          shred -u "$BACKUP_FILE" 2>/dev/null || rm -f "$BACKUP_FILE"
          echo "BACKUP_FILE=$ENC" >> "$GITHUB_ENV"
          echo "Encrypted -> $ENC ($(wc -c < "$ENC") bytes); plaintext removed."

      - name: Upload backup artifact (offsite copy, encrypted)
        uses: actions/upload-artifact@v4
        with:
          name: dispatchos-db-backup-encrypted
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
