name: Poll Cron (load sources + driver reminders)

# Business-critical FREQUENT jobs that the daily cron can't cover:
#   1. /api/cron/run-load-sources  — poll every due load_source, ingest new
#      loads, score them, and push high-score matches to carriers' Telegram
#      (the core "start receiving offers" loop). MUST run often or carriers see
#      stale boards and miss loads.
#   2. /api/cron/pickup-reminders  — ping assigned drivers before a load's
#      pickup window (default 3h lead). Needs sub-hourly cadence to be useful.
#
# Runs every 30 min — frequent enough for load boards and the 3h pickup-
# reminder lead while staying inside the free GH-Actions minutes budget
# (the old */15 here plus a duplicate */5 load-sources-poll.yml burned far
# past the 2k free min/mo; this is now the ONLY load-source poller).
#
# Set repo variable DISPATCHOS_BASE_URL to the live app URL (falls back to demo)
# and secret CRON_SECRET (must equal the app's DISPATCHOS_CRON_SECRET).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo. Nothing here uses
# GITHUB_TOKEN to write (no pushes, issues, PR comments, packages or releases).
permissions:
  contents: read

concurrency:
  group: poll-cron
  cancel-in-progress: false

env:
  BASE_URL: ${{ vars.DISPATCHOS_BASE_URL || 'https://demo.dispatchos.co' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poll load sources (ingest + score + alert)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Capture the HTTP status and fail red on non-200. Without this a 401
          # (CRON_SECRET drift), 503 (secret unset on Fly), 404 (base-URL drift)
          # or network failure kept the run GREEN — piping curl into head made
          # head's exit 0 win the pipeline — so the core load-ingest heartbeat
          # could die silently for weeks. Mirrors daily-cron.yml.
          CODE=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST "$BASE_URL/api/cron/run-load-sources" \
            -H "X-Cron-Secret: $CRON_SECRET" --max-time 120 || echo 000)
          head -c 1200 /tmp/resp 2>/dev/null; echo ""
          if [ "$CODE" != "200" ]; then
            echo "::error::run-load-sources HTTP $CODE"
            exit 1
          fi

      - name: Pickup reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          CODE=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST "$BASE_URL/api/cron/pickup-reminders" \
            -H "X-Cron-Secret: $CRON_SECRET" --max-time 60 || echo 000)
          head -c 800 /tmp/resp 2>/dev/null; echo ""
          if [ "$CODE" != "200" ]; then
            echo "::error::pickup-reminders HTTP $CODE"
            exit 1
          fi
