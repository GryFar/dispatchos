name: Daily Cron (billing + compliance)

# Fires every day at 13:00 UTC (09:00 ET / 06:00 PT) — early morning for US ops.
# Hits three endpoints in sequence:
#   1. /api/cron/check-insurance       — insurance expiry alerts (Phase 7.2)
#   2. /api/cron/check-renewals        — UCR/IRP renewal alerts (PR #86)
#   3. /api/cron/check-trial-expiry    — trial reminders + auto-expire (PR #94)
#
# Each call is independent — a failure on one doesn't skip the others.
# All endpoints are anti-spam / idempotent on their own (anti-dupe rows).

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: daily-cron
  cancel-in-progress: false

# Target host is configurable so the cron follows the real deployment. Set repo
# variable DISPATCHOS_BASE_URL to the live app URL; falls back to demo. The old
# hardcoded https://dispatchos.co pointed at the wrong host, so every cron
# silently 404'd (trial-expiry / insurance / purge never ran in prod).
env:
  BASE_URL: ${{ vars.DISPATCHOS_BASE_URL || 'https://demo.dispatchos.co' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # H1: capture the HTTP status. The old `curl -sS | head` swallowed every
      # non-200 (a wrong host, a 401 from a drifted CRON_SECRET, a 500) and exited
      # 0, so the workflow stayed GREEN while billing/compliance/purge silently
      # never ran. Each endpoint is still hit independently (one failure does not
      # skip the others); we record failures and fail the whole job red at the end.
      - name: Check insurance expiries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST "$BASE_URL/api/cron/check-insurance" \
            -H "X-Cron-Secret: $CRON_SECRET" --max-time 60)
          echo "check-insurance -> HTTP $code"; head -c 800 /tmp/resp; echo ""
          [ "$code" = "200" ] || echo "check-insurance HTTP $code" >> /tmp/cron-failures

      - name: Check UCR/IRP renewals
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST "$BASE_URL/api/cron/check-renewals" \
            -H "X-Cron-Secret: $CRON_SECRET" --max-time 60)
          echo "check-renewals -> HTTP $code"; head -c 800 /tmp/resp; echo ""
          [ "$code" = "200" ] || echo "check-renewals HTTP $code" >> /tmp/cron-failures

      - name: Check trial expiry
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST "$BASE_URL/api/cron/check-trial-expiry" \
            -H "X-Cron-Secret: $CRON_SECRET" --max-time 60)
          echo "check-trial-expiry -> HTTP $code"; head -c 800 /tmp/resp; echo ""
          [ "$code" = "200" ] || echo "check-trial-expiry HTTP $code" >> /tmp/cron-failures

      - name: Purge old data (audit, fuel, email, pings)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST "$BASE_URL/api/cron/purge-old-data" \
            -H "X-Cron-Secret: $CRON_SECRET" --max-time 60)
          echo "purge-old-data -> HTTP $code"; head -c 800 /tmp/resp; echo ""
          [ "$code" = "200" ] || echo "purge-old-data HTTP $code" >> /tmp/cron-failures

      - name: Fail if any cron endpoint did not return 200
        if: always()
        run: |
          if [ -s /tmp/cron-failures ]; then
            echo "::error::Daily cron had failures:"; cat /tmp/cron-failures
            exit 1
          fi
          echo "All daily cron endpoints returned 200."
