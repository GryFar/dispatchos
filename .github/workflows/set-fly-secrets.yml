name: Set Fly secrets (manual)

# Manually-triggered Fly secrets setter. Lets us push new secrets without
# touching the deploy pipeline OR exposing flyctl tokens outside of GH
# Actions. Existing autodeploy is unaffected — this workflow only mutates
# the running app's env via `flyctl secrets set`, which triggers Fly's own
# rolling restart (~30s downtime per instance).
#
# Usage flow:
#   1. Add the new secret(s) to the GitHub repo Settings → Secrets and
#      variables → Actions. Name them with the FLY_SECRET_ prefix exactly
#      so this workflow picks them up automatically (see steps below).
#   2. Go to Actions → "Set Fly secrets (manual)" → Run workflow.
#   3. Pick the app (default: dispatchos-demo).
#   4. Workflow runs, app restarts with new env.
#   5. Verify with `curl https://dispatchos.co/api/health` after restart.
#
# Why a separate workflow:
#   - secrets set is rare (once per service integration) — doesn't belong
#     in the main deploy path
#   - manual trigger forces an intentional click, no accidental rotation
#   - all rotations are traceable in Actions history
#
# Security notes:
#   - Pin flyctl-actions to a specific SHA (audit High v3) — never @master
#   - GH Secrets are encrypted at rest; the only place plaintext exists is
#     the runner's ephemeral env during the `secrets set` call
#   - Setting an empty string DELETES the secret in Fly — don't leave
#     FLY_SECRET_* blank in GH Settings unless you actually want to unset

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Fly app name"
        required: true
        default: "dispatchos-demo"
        type: choice
        options:
          - dispatchos-demo

permissions:
  contents: read

concurrency:
  group: fly-secrets-${{ github.event.inputs.app }}
  cancel-in-progress: false

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        # Match existing deploy.yml pin (Audit High V3-? required no @master).
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Verify auth
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth whoami
          flyctl status --app "${{ github.event.inputs.app }}"

      # ----------------------------------------------------------------------
      # Set Twilio Verify secrets (Anti-fraud Priority 4 — SMS verification).
      #
      # Pulled from GH Secrets:
      #   FLY_SECRET_TWILIO_ACCOUNT_SID
      #   FLY_SECRET_TWILIO_API_KEY_SID
      #   FLY_SECRET_TWILIO_API_KEY_SECRET
      #   FLY_SECRET_TWILIO_VERIFY_SERVICE_SID
      #
      # If any are blank/missing we skip them (Fly would otherwise UNSET the
      # var, which is destructive). The summary at the end of the job lists
      # exactly which secrets the workflow touched.
      # ----------------------------------------------------------------------
      - name: Set Twilio Verify secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.FLY_SECRET_TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY_SID: ${{ secrets.FLY_SECRET_TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.FLY_SECRET_TWILIO_API_KEY_SECRET }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.FLY_SECRET_TWILIO_VERIFY_SERVICE_SID }}
        run: |
          set -euo pipefail
          APP="${{ github.event.inputs.app }}"
          # Collect non-empty kv pairs into a single `secrets set` call so
          # Fly only does ONE rolling restart even when we ship several at
          # once. Empty values are skipped — we never want to send `KEY=`
          # to flyctl (that's an unset).
          PAIRS=()
          if [ -n "${TWILIO_ACCOUNT_SID:-}" ]; then
            PAIRS+=("TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID")
            echo "twilio_account_sid=present" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${TWILIO_API_KEY_SID:-}" ]; then
            PAIRS+=("TWILIO_API_KEY_SID=$TWILIO_API_KEY_SID")
          fi
          if [ -n "${TWILIO_API_KEY_SECRET:-}" ]; then
            PAIRS+=("TWILIO_API_KEY_SECRET=$TWILIO_API_KEY_SECRET")
          fi
          if [ -n "${TWILIO_VERIFY_SERVICE_SID:-}" ]; then
            PAIRS+=("TWILIO_VERIFY_SERVICE_SID=$TWILIO_VERIFY_SERVICE_SID")
          fi

          if [ "${#PAIRS[@]}" -eq 0 ]; then
            echo "No Twilio secrets configured in GH Settings — nothing to set."
            echo "Add FLY_SECRET_TWILIO_* in repo Settings → Secrets and re-run."
            exit 0
          fi

          echo "Setting ${#PAIRS[@]} Twilio secret(s) on app $APP..."
          # --stage so we batch — actual restart happens at deploy command.
          # Drop --stage for immediate restart (we want immediate here so
          # Влад's PR can rely on fresh env right after this run).
          flyctl secrets set --app "$APP" "${PAIRS[@]}"

      - name: Verify app health post-restart
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="${{ github.event.inputs.app }}"
          # Give Fly ~60s to roll the new env across instances before we
          # poke the public health endpoint. The internal flyctl status
          # check is more authoritative but slower — we surface both.
          echo "Waiting 60s for rolling restart to settle..."
          sleep 60
          flyctl status --app "$APP"
          echo "---"
          echo "Probing public health endpoint:"
          curl -fsS "https://dispatchos.co/api/health" || (echo "Health probe failed"; exit 1)
          echo ""
